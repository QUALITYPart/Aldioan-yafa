<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<title>ديوان القفعة الملكي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<!-- Supabase browser client: use only the publishable key in this file. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --teal: #0F4C5C;
    --teal-dark: #0A343F;
    --teal-tint: #E7EFF0;
    --gold: #D4A373;
    --gold-deep: #B8834F;
    --bg: #F8F9FA;
    --surface: #FFFFFF;
    --ink: #14282E;
    --ink-muted: #5C7A82;
    --line: rgba(15, 76, 92, 0.12);
    --shadow-card: 0 1px 2px rgba(15,76,92,0.06), 0 8px 24px rgba(15,76,92,0.08);
    --radius-lg: 26px;
    --radius-md: 18px;
    --radius-sm: 12px;
  }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; background:var(--bg); color:var(--ink); font-family:'Tajawal',sans-serif; -webkit-font-smoothing:antialiased; }
  body { display:flex; justify-content:center; }

  /* `hidden` creates a scroll container and prevents the sticky card stack
     from pinning on mobile browsers. `clip` keeps the same visual clipping
     without breaking position:sticky. */
  .device { width:100%; max-width:430px; min-height:100vh; background:var(--bg); position:relative; overflow-x:clip; }

  .device[data-theme="dark"] {
    --bg:#0E1E23; --surface:#16292E; --ink:#EAF1F2; --ink-muted:#8FB0B7;
    --line:rgba(255,255,255,0.08); --teal-tint:#142E33;
    --shadow-card:0 1px 2px rgba(0,0,0,0.2), 0 8px 24px rgba(0,0,0,0.35);
  }

  /* ---------- header ---------- */
  header.top { position:sticky; top:0; z-index:40; display:flex; align-items:center; justify-content:space-between; gap:10px; padding:14px 18px; background:color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter:blur(10px); border-bottom:1px solid var(--line); }
  .brand { display:flex; align-items:center; gap:10px; cursor:pointer; }
  .brand-mark { width:38px; height:38px; border-radius:12px; background:linear-gradient(155deg, var(--teal) 0%, var(--teal-dark) 100%); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .brand-mark svg { width:20px; height:20px; }
  .brand-text { line-height:1.15; }
  .brand-text b { display:block; font-size:15px; font-weight:800; }
  .brand-text span { display:block; font-size:11px; color:var(--ink-muted); font-weight:500; margin-top:1px; }
  .top-actions { display:flex; align-items:center; gap:8px; }
  .icon-btn { width:38px; height:38px; border-radius:12px; border:1px solid var(--line); background:var(--surface); display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--teal); flex-shrink:0; }
  [data-theme="dark"] .icon-btn { color:var(--gold); }
  .icon-btn:active { transform:scale(0.92); }
  .icon-btn svg { width:18px; height:18px; }
  .login-btn { height:38px; padding:0 16px; border-radius:12px; border:none; background:var(--teal); color:#fff; font-family:inherit; font-weight:700; font-size:13px; cursor:pointer; }
  .login-btn:active { transform:scale(0.96); }
  .user-pill { display:flex; align-items:center; gap:8px; background:var(--teal-tint); border-radius:100px; padding:5px 12px 5px 5px; cursor:pointer; border:none; font-family:inherit; }
  .user-pill .av { width:26px; height:26px; border-radius:50%; background:var(--teal); color:#fff; font-size:11px; display:flex; align-items:center; justify-content:center; font-weight:700; flex-shrink:0; }
  .user-pill .txt { text-align:right; line-height:1.1; }
  .user-pill b { display:block; font-size:11.5px; font-weight:800; color:var(--teal); }
  [data-theme="dark"] .user-pill b { color:var(--gold); }
  .user-pill span { display:block; font-size:9.5px; color:var(--ink-muted); font-weight:600; }

  /* ---------- hero ---------- */
  .hero { position:relative; margin:14px 18px 0; border-radius:var(--radius-lg); overflow:hidden; min-height:290px; display:flex; align-items:flex-end;
    background: linear-gradient(180deg, rgba(10,52,63,0.15) 0%, rgba(10,52,63,0.92) 88%), linear-gradient(120deg, #123f4d, #0a2830 60%); }
  .hero::before { content:""; position:absolute; inset:0; background-image: radial-gradient(circle at 18% 24%, rgba(212,163,115,0.35), transparent 40%), radial-gradient(circle at 82% 12%, rgba(255,255,255,0.08), transparent 35%); }
  .hero-content { position:relative; padding:26px 22px 22px; color:#fff; width:100%; }
  .hero-eyebrow { display:inline-flex; align-items:center; gap:6px; background:rgba(212,163,115,0.9); color:#2B1B0E; font-size:12px; font-weight:700; padding:5px 12px; border-radius:100px; margin-bottom:12px; }
  .hero h1 { margin:0 0 8px; font-size:25px; line-height:1.35; font-weight:800; max-width:280px; }
  .hero p { margin:0; font-size:13.5px; line-height:1.7; color:rgba(255,255,255,0.82); max-width:300px; }
  .hero-cta { margin-top:16px; display:flex; gap:10px; }
  .btn-gold { background:var(--gold); color:#2B1B0E; border:none; font-family:inherit; font-weight:800; font-size:13.5px; padding:11px 20px; border-radius:100px; cursor:pointer; }
  .btn-ghost { background:rgba(255,255,255,0.12); border:1px solid rgba(255,255,255,0.35); color:#fff; font-family:inherit; font-weight:700; font-size:13.5px; padding:11px 18px; border-radius:100px; cursor:pointer; }

  section, .page-header { padding:26px 18px 4px; }
  .page-header h1 { font-size:22px; font-weight:800; margin:0 0 6px; color:var(--ink); }
  .page-header p { font-size:13px; color:var(--ink-muted); margin:0; }

  .section-head { display:flex; align-items:baseline; justify-content:space-between; margin-bottom:14px; }
  .section-head h2 { font-size:19px; font-weight:800; margin:0; color:var(--ink); }
  .section-head a, .section-head button.linklike { font-size:12.5px; font-weight:700; color:var(--teal); text-decoration:none; background:none; border:none; cursor:pointer; font-family:inherit; }
  [data-theme="dark"] .section-head a, [data-theme="dark"] .section-head button.linklike { color:var(--gold); }
  [data-theme="dark"] .page-header h1,
  [data-theme="dark"] .section-head h2 {
    color:#F4FBFC;
    text-shadow:0 1px 10px rgba(0,0,0,.18);
  }

  /* ---------- about ---------- */
  .about-card { background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-md); padding:20px; box-shadow:var(--shadow-card); }
  .about-card p { margin:0; font-size:14px; line-height:1.9; color:var(--ink-muted); }
  .about-card p + p { margin-top:10px; }
  .about-signature { display:flex; align-items:center; gap:10px; margin-top:16px; padding-top:16px; border-top:1px dashed var(--line); }
  .about-signature .dot { width:8px; height:8px; border-radius:50%; background:var(--gold); }
  .about-signature span { font-size:12.5px; color:var(--ink-muted); font-weight:500; }

  /* ---------- stats ---------- */
  .stats-row { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  .stat { background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-sm); padding:16px 10px; text-align:center; }
  .stat b { display:block; font-size:21px; font-weight:800; color:var(--teal); }
  [data-theme="dark"] .stat b { color:var(--gold); }
  .stat span { display:block; font-size:11.5px; color:var(--ink-muted); margin-top:4px; font-weight:500; }

  /* ---------- hero background photo ---------- */
  .hero { background:none; }
  .hero-bg-img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; z-index:0; animation:heroZoom 16s ease-out forwards; }
  @keyframes heroZoom { from { transform:scale(1); } to { transform:scale(1.09); } }
  .hero-overlay { position:absolute; inset:0; z-index:1; background:linear-gradient(180deg, rgba(10,30,35,0.25) 0%, rgba(9,24,28,0.94) 90%); }
  .hero-content { z-index:2; }

  /* ---------- majlis feature ---------- */
  .majlis-feature { position:relative; }
  .majlis-photo { width:100%; aspect-ratio:3/4; max-height:420px; object-fit:cover; border-radius:var(--radius-lg); display:block; box-shadow:var(--shadow-card); }
  .majlis-caption { position:absolute; left:20px; right:20px; bottom:-18px; background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:14px 16px; box-shadow:var(--shadow-card); display:flex; align-items:center; gap:10px; }
  .majlis-caption .bar { width:3px; align-self:stretch; background:var(--gold); border-radius:3px; flex-shrink:0; }
  .majlis-caption p { margin:0; font-size:13px; font-weight:700; color:var(--ink); line-height:1.6; }
  .majlis-feature + section { padding-top:44px; }

  /* ---------- unity statement ---------- */
  .statement-block { text-align:center; padding:12px 8px; }
  .statement-block .line { width:36px; height:3px; background:var(--gold); margin:0 auto 16px; border-radius:3px; }
  .statement-block h2 { font-size:21px; line-height:1.6; font-weight:800; margin:0; color:var(--ink); }
  .statement-block h2 b { color:var(--teal); }
  [data-theme="dark"] .statement-block h2 b { color:var(--gold); }
  [data-theme="dark"] .statement-block h2 { color:#F4FBFC; }

  /* ---------- stacking cards ---------- */
  .stack-section { position:relative; height:250vh; margin-bottom:6px; }
  .stack-sticky { position:sticky; top:70px; height:60vh; max-height:none; min-height:340px; margin:0 18px; z-index:5; display:flex; flex-direction:column; gap:16px; }
  .stack-statement { flex:0 0 auto; padding:0 8px; }
  /* The stage clips cards that are waiting below it. This is what makes each
     new photo rise from underneath instead of appearing beside the stack. */
  .stack-stage { position:relative; width:100%; height:100%; min-height:0; overflow:hidden; border-radius:22px; isolation:isolate; flex:1 1 auto; }
  .stack-card { position:absolute; inset:0; border-radius:22px; overflow:hidden; box-shadow:0 14px 34px rgba(0,0,0,0.4); transform:translateY(100%); will-change:transform; }
  .stack-card:first-child { transform:translateY(0); }
  .stack-card img { width:100%; height:100%; object-fit:cover; display:block; }
  .stack-caption-tag { position:absolute; left:0; right:0; bottom:0; padding:18px 18px 14px; background:linear-gradient(0deg, rgba(8,18,21,0.88), transparent); }
  .stack-caption-tag b { display:block; color:#fff; font-size:14.5px; font-weight:800; }
  .stack-caption-tag span { display:block; color:rgba(255,255,255,0.75); font-size:11.5px; margin-top:2px; }

  /* ---------- motivational statement ---------- */
  .motivation-section { padding:26px 18px 8px; }
  .motivation-card { position:relative; overflow:hidden; isolation:isolate; text-align:center; padding:28px 20px 26px; border:1px solid rgba(212,163,115,0.28); border-radius:24px; background:linear-gradient(145deg, var(--teal-dark) 0%, var(--teal) 58%, #176679 100%); box-shadow:0 16px 34px rgba(15,76,92,0.2); }
  .motivation-card::before { content:""; position:absolute; inset:-45%; z-index:-1; background:radial-gradient(circle, rgba(212,163,115,0.24), transparent 38%); transform:translate3d(-14%, -10%, 0); opacity:0; }
  .motivation-card::after { content:""; position:absolute; left:50%; top:0; width:56px; height:3px; border-radius:99px; background:var(--gold); transform:translateX(-50%) scaleX(0); transform-origin:center; }
  .motivation-card h2, .motivation-card p { opacity:0; transform:translateY(18px); }
  .motivation-card h2 { margin:0; color:#fff; font-size:21px; line-height:1.65; font-weight:800; }
  .motivation-card p { margin:8px 0 0; color:rgba(255,255,255,0.78); font-size:13.5px; line-height:1.8; }
  .motivation-section.is-visible .motivation-card::before { animation:motivationGlow 1.8s ease-out forwards; }
  .motivation-section.is-visible .motivation-card::after { animation:motivationLine .7s 0.1s cubic-bezier(.22,1,.36,1) forwards; }
  .motivation-section.is-visible .motivation-card h2 { animation:motivationReveal .75s .18s cubic-bezier(.22,1,.36,1) forwards; }
  .motivation-section.is-visible .motivation-card p { animation:motivationReveal .75s .34s cubic-bezier(.22,1,.36,1) forwards; }
  @keyframes motivationGlow { 0% { opacity:0; transform:translate3d(-14%,-10%,0) scale(.75); } 45% { opacity:1; } 100% { opacity:.55; transform:translate3d(20%,18%,0) scale(1.15); } }
  @keyframes motivationLine { to { transform:translateX(-50%) scaleX(1); } }
  @keyframes motivationReveal { to { opacity:1; transform:translateY(0); } }
  @media (prefers-reduced-motion:reduce) {
    .motivation-card::before, .motivation-card::after, .motivation-card h2, .motivation-card p { animation:none !important; opacity:1; transform:none; }
  }

  /* ---------- contact photo card ---------- */
  .contact-photo-card { position:relative; border-radius:var(--radius-md); overflow:hidden; color:#fff; min-height:300px; display:flex; align-items:stretch; }
  .contact-photo-card img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; filter:brightness(0.5) saturate(0.9); }
  .contact-photo-card::after { content:""; position:absolute; inset:0; background:linear-gradient(165deg, rgba(9,24,28,0.55) 0%, rgba(9,24,28,0.92) 100%); }
  .contact-photo-card .cp-inner { position:relative; z-index:1; padding:24px 20px; width:100%; }
  .contact-photo-card h3 { margin:0 0 6px; font-size:17px; font-weight:800; }
  .contact-photo-card > .cp-inner > p { font-size:13px; line-height:1.8; color:rgba(255,255,255,0.8); margin:0 0 18px; }
  .contact-link-rows { display:flex; flex-direction:column; gap:10px; }
  .contact-link-row { display:flex; align-items:center; gap:12px; padding:12px 14px; background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.18); border-radius:14px; text-decoration:none; color:#fff; }
  .contact-link-row .ic { width:34px; height:34px; border-radius:10px; background:rgba(212,163,115,0.9); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .contact-link-row .ic svg { width:17px; height:17px; color:#2B1B0E; }
  .contact-link-row .txt b { display:block; font-size:13px; font-weight:700; }
  .contact-link-row .txt span { display:block; font-size:11.5px; color:rgba(255,255,255,0.7); direction:ltr; text-align:right; }

  /* ---------- location card ---------- */
  .location-card { background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-md); padding:18px; box-shadow:var(--shadow-card); }
  .location-card .loc-row { display:flex; align-items:flex-start; gap:12px; margin-bottom:14px; }
  .location-card .loc-row .ic { width:34px; height:34px; border-radius:10px; background:var(--teal-tint); color:var(--teal); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  [data-theme="dark"] .location-card .loc-row .ic { color:var(--gold); }
  .location-card .loc-row .ic svg { width:17px; height:17px; }
  .location-card .loc-row p { margin:0; font-size:13px; line-height:1.8; color:var(--ink-muted); }
  .location-btn { display:flex; align-items:center; justify-content:center; gap:8px; width:100%; background:var(--teal); color:#fff; border:none; font-family:inherit; font-weight:700; font-size:13.5px; padding:13px; border-radius:100px; cursor:pointer; text-decoration:none; }
  [data-theme="dark"] .location-btn { background:var(--gold); color:#2B1B0E; }
  .location-btn svg { width:16px; height:16px; }

  /* ---------- key figures ---------- */
  .figures-row { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; }
  .figure-card { background:var(--surface); border:1px dashed var(--line); border-radius:var(--radius-sm); padding:18px 10px; text-align:center; }
  .figure-avatar { width:56px; height:56px; border-radius:50%; margin:0 auto 10px; display:flex; align-items:center; justify-content:center; background:var(--teal-tint); color:var(--ink-muted); border:1px dashed var(--line); }
  [data-theme="dark"] .figure-avatar { color:var(--ink-muted); }
  .figure-avatar svg { width:24px; height:24px; }
  .figure-card b { display:block; font-size:13px; font-weight:700; color:var(--ink); }
  .figure-card span { display:block; font-size:11px; color:var(--ink-muted); margin-top:4px; }
  [data-theme="dark"] .figure-card b { color:#F4FBFC; }

  /* ---------- journey transformation ---------- */
  .journey-section { position:relative; min-height:190vh; padding:26px 18px 8px; }
  .journey-sticky { position:sticky; top:70px; height:calc(100vh - 110px); min-height:470px; display:flex; flex-direction:column; }
  .journey-heading { flex:0 0 auto; text-align:center; padding:0 8px 16px; }
  .journey-heading .line { width:36px; height:3px; margin:0 auto 13px; border-radius:99px; background:var(--gold); }
  .journey-heading h2 { margin:0; color:var(--ink); font-size:21px; line-height:1.6; font-weight:900; }
  .journey-heading p { margin:5px auto 0; max-width:330px; color:var(--ink-muted); font-size:12.5px; line-height:1.8; }
  [data-theme="dark"] .journey-heading h2 { color:#F4FBFC; }
  .journey-stage { position:relative; flex:1 1 auto; min-height:0; overflow:hidden; border-radius:28px; isolation:isolate; background:var(--teal-dark); box-shadow:0 18px 45px rgba(15,76,92,.24); }
  .journey-image { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; will-change:transform,opacity; }
  .journey-image { opacity:0; transform:scale(1.12); }
  .journey-image.stage-0 { opacity:1; transform:scale(1.02); }
  .journey-stage::after { content:""; position:absolute; inset:0; z-index:1; background:linear-gradient(180deg, rgba(7,21,25,.04) 25%, rgba(7,21,25,.86) 100%); pointer-events:none; }
  .journey-copy { position:absolute; z-index:2; right:22px; left:22px; bottom:25px; color:#fff; text-align:right; will-change:opacity,transform; }
  .journey-copy { opacity:0; transform:translateY(18px); }
  .journey-copy.stage-0 { opacity:1; transform:translateY(0); }
  .journey-copy .eyebrow { display:inline-flex; align-items:center; gap:7px; margin-bottom:8px; color:var(--gold); font-size:11px; font-weight:800; letter-spacing:.02em; }
  .journey-copy .eyebrow::before { content:""; width:22px; height:2px; border-radius:99px; background:var(--gold); }
  .journey-copy h3 { margin:0; font-size:24px; line-height:1.45; font-weight:900; text-shadow:0 3px 18px rgba(0,0,0,.22); }
  .journey-copy p { margin:7px 0 0; max-width:330px; color:rgba(255,255,255,.82); font-size:13px; line-height:1.9; }
  .journey-progress { position:absolute; z-index:3; top:20px; left:20px; right:20px; height:4px; overflow:hidden; border-radius:99px; background:rgba(255,255,255,.22); }
  .journey-progress span { display:block; width:50%; height:100%; border-radius:inherit; background:var(--gold); transform-origin:right center; transform:scaleX(0); will-change:transform; }
  .journey-badge { position:absolute; z-index:3; top:36px; left:20px; padding:6px 10px; border:1px solid rgba(255,255,255,.28); border-radius:99px; background:rgba(8,18,21,.3); color:rgba(255,255,255,.84); font-size:10px; font-weight:700; backdrop-filter:blur(8px); }
  @media (max-width:420px) {
    .journey-copy h3 { font-size:21px; }
    .journey-copy p { font-size:12px; }
  }
  @media (prefers-reduced-motion:reduce) {
    .journey-image, .journey-copy, .journey-progress span { transition:none !important; }
  }

  /* ---------- filter chips ---------- */
  .filter-row { display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; margin-bottom:16px; }
  .filter-chip { flex:0 0 auto; border:1px solid var(--line); background:var(--surface); padding:8px 16px; border-radius:100px; font-size:12.5px; font-weight:700; color:var(--ink-muted); cursor:pointer; font-family:inherit; }
  .filter-chip.active { background:var(--teal); border-color:var(--teal); color:#fff; }

  /* ---------- project cards ---------- */
  .projects-stack { display:flex; flex-direction:column; gap:14px; }
  .project-card { background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-md); overflow:hidden; box-shadow:var(--shadow-card); }
  .project-cover { position:relative; height:132px; background:linear-gradient(135deg, var(--teal) 0%, #196376 55%, var(--teal-dark) 100%); overflow:hidden; }
  .project-cover.cover-b { background:linear-gradient(135deg, #1B5563 0%, #0E4655 60%, #082C36 100%); }
  .project-cover.cover-c { background:linear-gradient(135deg, #135160 0%, #0C3A45 65%, #082A33 100%); }
  .project-cover-img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; }
  .project-gallery-image { display:none; }
  .project-gallery-image.active { display:block; }
  .project-image-count { position:absolute; bottom:12px; left:12px; z-index:3; display:inline-flex; align-items:center; gap:5px; padding:5px 9px; border-radius:100px; background:rgba(8,30,37,.62); color:#fff; font-size:11px; font-weight:800; backdrop-filter:blur(6px); }
  .project-gallery-nav { position:absolute; inset:0; z-index:4; display:flex; align-items:center; justify-content:space-between; padding:0 8px; pointer-events:none; }
  .project-gallery-nav button { pointer-events:auto; width:30px; height:30px; border:1px solid rgba(255,255,255,.42); border-radius:50%; background:rgba(8,30,37,.5); color:#fff; display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:18px; line-height:1; }
  .project-cover::after { content:""; position:absolute; inset:0; background:linear-gradient(180deg, rgba(8,30,37,0.05) 20%, rgba(8,30,37,0.55) 100%), radial-gradient(circle at 78% 20%, rgba(212,163,115,0.32), transparent 45%); pointer-events:none; }
  .status-chip { position:absolute; top:12px; right:12px; font-size:11px; font-weight:700; padding:5px 11px; border-radius:100px; display:flex; align-items:center; gap:5px; backdrop-filter:blur(6px); }
  .status-chip .pip { width:6px; height:6px; border-radius:50%; }

  .auth-sheet .modal-handle { display:none; }
  .auth-top {

  .auth-heading { text-align:center; margin:0 8px 20px; }
  .auth-kicker {

  .auth-name-input {

  .auth-pin-stage { position:relative; height:86px; margin:0 0 8px; direction:ltr; }
  .auth-slots {
    position:absolute;
    inset:0;

  [data-theme="dark"] .auth-slot input { background:rgba(0,0,0,.2); border-color:rgba(255,255,255,.1); }
  .auth-slot input::-webkit-outer-spin-button,
  .auth-slot input::-webkit-inner-spin-button { -webkit-appearance:none; margin:0; }

  .auth-slot.filled input {

  .auth-slot-glow { position:absolute; inset:-4px; pointer-events:none; z-index:2; }

  .auth-slot-glow rect {
    fill:none;

  .auth-slot.glowing .auth-slot-glow rect { animation:authLap .5s ease forwards; }
  @keyframes authLap {

  .auth-result {
    position:absolute;
    top:8px;
    left:50%;
    width:56px;
    height:64px;

    border-radius:15px;
    background:var(--surface);
    border:1.5px solid var(--line);

  .auth-result.show {

    transition:transform .5s cubic-bezier(.34,1.55,.4,1), opacity .28s ease;
  }
  .auth-result.win {

  }
  .auth-result.bad {

  .auth-result svg { width:25px; height:25px; position:absolute; }
  .auth-result .auth-check path {

    stroke-dasharray:24; stroke-dashoffset:24;

  .auth-result.win .auth-check path { animation:authDraw .3s ease .18s forwards; }
  .auth-result .auth-x path {
    fill:none; stroke:#D94D5A; stroke-width:3; stroke-linecap:round;
    stroke-dasharray:20; stroke-dashoffset:20; opacity:0;
  }
  .auth-result.bad .auth-check { opacity:0; }
  .auth-result.bad .auth-x path { opacity:1; animation:authDraw .22s ease forwards; }
  @keyframes authDraw { to { stroke-dashoffset:0; } }
  .auth-status {
    min-height:18px;
    margin:0 0 12px;
    color:#A6534F;
    text-align:center;
    font-size:12px;
    opacity:0;
    transition:opacity .18s ease;
  }

  .auth-submit {
    width:100%;

    border-radius:15px;
    padding:13px 18px;
    background:linear-gradient(135deg,var(--teal),var(--teal-dark));

    font-family:inherit;
    font-size:13.5px;
    font-weight:900;
    cursor:pointer;
    box-shadow:0 10px 22px rgba(15,76,92,.22);

  }
  .auth-submit:active { transform:translateY(1px) scale(.99); box-shadow:0 5px 14px rgba(15,76,92,.18); }
  .auth-switch { margin:17px 0 0; text-align:center; color:var(--ink-muted); font-size:12px; }
  .auth-switch button {
    border:0;
    padding:0;

    font-size:12px;

  @media (max-width:380px) {
    .modal-overlay.auth-mode { padding:10px; }

    .auth-slots { gap:8px; }

  }

  /* ---------- fab & toast ---------- */
  .page-fab { position:fixed; bottom:112px; left:24px; width:52px; height:52px; border-radius:50%; background:var(--teal); color:#fff; display:flex; align-items:center; justify-content:center; box-shadow:0 10px 24px rgba(15,76,92,0.35); cursor:pointer; z-index:45; }
  .page-fab svg { width:22px; height:22px; }
  .toast { position:fixed; bottom:130px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--ink); color:var(--bg); padding:12px 20px; border-radius:100px; font-size:13px; font-weight:700; opacity:0; pointer-events:none; transition:0.25s ease; z-index:300; white-space:nowrap; }
  .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

  /* ---------- bottom nav ---------- */
  .bottom-space { height:110px; }
  nav.bottom { position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:430px; padding:0 18px 22px; z-index:50; pointer-events:none; }
  .bottom-bar { pointer-events:all; background:color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter:blur(14px); border:1px solid var(--line); border-radius:100px; box-shadow:0 12px 30px rgba(15,76,92,0.16); display:flex; align-items:center; justify-content:space-around; padding:8px 6px; position:relative; }
  .nav-item { background:none; border:none; display:flex; flex-direction:column; align-items:center; gap:3px; color:var(--ink-muted); font-family:inherit; font-size:10.5px; font-weight:700; padding:8px 12px; cursor:pointer; flex:1; }
  .nav-item svg { width:20px; height:20px; }

  .nav-fab-wrap { flex:0 0 auto; display:flex; justify-content:center; width:64px; }
  .nav-fab { width:54px; height:54px; border-radius:50%; background:linear-gradient(155deg, var(--gold), var(--gold-deep)); border:4px solid var(--bg); display:flex; align-items:center; justify-content:center; margin-top:-30px; box-shadow:0 8px 18px rgba(184,131,79,0.45); cursor:pointer; }
  .nav-fab svg { width:22px; height:22px; color:#2B1B0E; }
  .nav-fab.active-fab { box-shadow:0 0 0 3px rgba(212,163,115,0.4), 0 8px 18px rgba(184,131,79,0.45); }

  /* ---------- premium identity accordion ---------- */
  .identity-section {
    position:relative;
    isolation:isolate;
    overflow:hidden;
    margin:8px 18px 4px;
    padding:24px 16px 18px;
    border:1px solid rgba(212,163,115,0.25);
    border-radius:30px;
    background:
      linear-gradient(145deg, rgba(255,255,255,0.97), rgba(231,239,240,0.72)),

  }
  .identity-section::before,
  .identity-section::after {
    content:"";

    pointer-events:none;
    z-index:-1;
    opacity:.42;
  }
  .identity-section::before {
    inset:0;

      linear-gradient(30deg, transparent 44%, rgba(212,163,115,.16) 45%, transparent 46%),
      linear-gradient(150deg, transparent 44%, rgba(15,76,92,.08) 45%, transparent 46%);

    mask-image:linear-gradient(135deg, rgba(0,0,0,.8), transparent 74%);

  .identity-section::after {
    width:170px;
    height:170px;
    top:-78px;
    left:-56px;
    border:1px solid rgba(212,163,115,.34);

  }
  [data-theme="dark"] .identity-section {

  }
  .identity-heading { position:relative; text-align:center; margin:0 8px 20px; }
  .identity-kicker {
    display:inline-flex;
    align-items:center;
    gap:8px;
    color:var(--gold-deep);
    font-size:11px;
    font-weight:800;
    letter-spacing:.03em;
    margin-bottom:7px;
  }
  [data-theme="dark"] .identity-kicker { color:var(--gold); }
  .identity-kicker::before,
  .identity-kicker::after {
    content:"";
    width:24px;
    height:1px;
    background:var(--gold);
    opacity:.8;
  }
  .identity-heading h2 { margin:0; color:var(--teal); font-size:21px; font-weight:900; line-height:1.45; }
  [data-theme="dark"] .identity-heading h2 { color:#EAF1F2; }
  .identity-heading p { margin:6px 0 0; color:var(--ink-muted); font-size:12.5px; line-height:1.75; }
  .identity-accordion { display:flex; flex-direction:column; gap:12px; }
  .identity-card {
    position:relative;
    overflow:hidden;
    border:1px solid rgba(15,76,92,.10);
    border-radius:24px;
    background:rgba(255,255,255,.82);
    box-shadow:0 6px 18px rgba(15,76,92,.06);
    transition:transform .35s ease, box-shadow .35s ease, border-color .35s ease;
  }
  [data-theme="dark"] .identity-card { background:rgba(22,41,46,.86); border-color:rgba(255,255,255,.07); }
  .identity-card:active { transform:translateY(-2px) scale(.995); }
  .identity-card.is-open {
    border-color:rgba(212,163,115,.74);
    box-shadow:0 0 0 1px rgba(212,163,115,.22), 0 12px 28px rgba(184,131,79,.19);
  }
  .identity-card.is-open::before {
    content:"";
    position:absolute;
    inset:0;
    pointer-events:none;
    background:linear-gradient(110deg, rgba(212,163,115,.13), transparent 38%);
  }
  .identity-trigger {
    position:relative;
    z-index:1;
    width:100%;
    display:grid;
    grid-template-columns:46px 1fr 28px;
    align-items:center;
    gap:12px;
    padding:16px 14px;
    border:0;
    background:transparent;
    color:var(--ink);
    font-family:inherit;
    text-align:right;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  .identity-trigger:focus-visible { outline:3px solid rgba(212,163,115,.45); outline-offset:-3px; }
  .identity-icon {
    width:46px;
    height:46px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:16px;
    color:var(--gold-deep);
    background:linear-gradient(145deg, rgba(212,163,115,.18), rgba(212,163,115,.05));
    border:1px solid rgba(212,163,115,.34);
    transition:background .35s ease, color .35s ease, transform .35s ease;
  }
  .identity-icon svg { width:23px; height:23px; }
  .identity-card.is-open .identity-icon {
    color:#fff;

    transform:rotate(-3deg);

  .identity-copy { min-width:0; }
  .identity-copy strong { display:block; color:var(--teal); font-size:17px; font-weight:900; line-height:1.35; }

  .identity-copy span { display:block; overflow:hidden; margin-top:4px; color:var(--ink-muted); font-size:11.5px; line-height:1.65; text-overflow:ellipsis; white-space:nowrap; }
  .identity-chevron {
    width:28px;
    height:28px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--gold-deep);
    transition:transform .38s cubic-bezier(.22,.61,.36,1), color .3s ease;
  }
  .identity-chevron svg { width:18px; height:18px; }

  [data-theme="dark"] .identity-card.is-open .identity-chevron { color:var(--gold); }
  .identity-answer {

    grid-template-rows:0fr;

  .identity-card.is-open .identity-answer { grid-template-rows:1fr; opacity:1; }
  .identity-answer-clip { min-height:0; overflow:hidden; }
  .identity-answer-inner {
    margin:0 14px;
    padding:0 2px;
    border-top:1px solid rgba(212,163,115,.22);
    color:var(--ink-muted);
    font-size:13px;
    line-height:2;

  .identity-card.is-open .identity-answer-inner { padding-top:13px; padding-bottom:17px; transform:translateY(0); }
  .identity-answer-inner h3 { margin:0 0 4px; color:var(--teal); font-size:13px; font-weight:900; }
  [data-theme="dark"] .identity-answer-inner h3 { color:var(--gold); }
  .identity-answer-inner p { margin:0; }
  .identity-answer-inner p + p { margin-top:8px; }

  .identity-answer-inner li { padding-right:2px; }

  @media (min-width:480px) {
    .identity-section { margin-left:24px; margin-right:24px; }
  }

  #page-root { animation:fadeIn 0.2s ease; }
  @keyframes fadeIn { from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }

  ::-webkit-scrollbar { display:none; }

function escapeHtml(value){
  return String(value ?? '').replace(/[&<>"']/g, ch => ({
    '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
  }[ch]));
}

function projectImageFileError(file){
  if(!file) return 'اختر صورة أولًا';
  if(!PROJECT_IMAGE_MIME_TYPES.includes(file.type)){
    return 'نوع الصورة غير مدعوم. استخدم JPG أو PNG أو WEBP أو GIF.';
  }
  if(file.size > PROJECT_IMAGE_MAX_BYTES){
    return 'حجم الصورة كبير. الحد الأقصى هو 5 ميجابايت.';
  }
  return '';
}

async function projectImageContentError(file){
  const basicError = projectImageFileError(file);
  if(basicError) return basicError;
  try{
    if(typeof createImageBitmap === 'function'){
      const bitmap = await createImageBitmap(file);
      if(bitmap?.close) bitmap.close();
      return '';
    }
    return await new Promise(resolve => {
      const url = URL.createObjectURL(file);
      const image = new Image();
      const finish = message => {
        URL.revokeObjectURL(url);
        resolve(message);
      };
      image.onload = () => finish('');
      image.onerror = () => finish('هذه الصورة تالفة أو لا يمكن قراءتها. احذفها واختر صورة أخرى.');
      image.src = url;
    });
  }catch(error){
    return 'هذه الصورة تالفة أو لا يمكن قراءتها. احذفها واختر صورة أخرى.';
  }
}

function projectImageToken(){
  return window.crypto?.randomUUID?.() ||
    'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, char => {
      const random = Math.random() * 16 | 0;
      const value = char === 'x' ? random : (random & 0x3 | 0x8);
      return value.toString(16);
    });
}

function projectImagePath(projectId, file){
  const extension = (file.name.split('.').pop() || 'img').toLowerCase().replace(/[^a-z0-9]/g, '').slice(0, 8) || 'img';
  return `covers/${projectId}/${Date.now()}-${projectImageToken()}.${extension}`;
}

async function uploadProjectCover(file, projectId){
  const validationError = projectImageFileError(file);
  if(validationError) throw new Error(validationError);
  if(!supabaseClient) throw new Error('backend_not_configured');

  const path = projectImagePath(projectId, file);
  const { error } = await supabaseClient.storage
    .from(PROJECT_IMAGE_BUCKET)
    .upload(path, file, {
      cacheControl: '31536000',
      contentType: file.type,
      upsert: false
    });
  if(error) throw error;

  const { data } = supabaseClient.storage
    .from(PROJECT_IMAGE_BUCKET)
    .getPublicUrl(path);
  return { path, url: `${data.publicUrl}?v=${Date.now()}` };
}

async function deleteProjectCover(path){
  if(!path || !supabaseClient) return;
  const { error } = await supabaseClient.storage
    .from(PROJECT_IMAGE_BUCKET)
    .remove([path]);
  if(error) console.warn('Old project cover cleanup failed:', error);
}

function projectImageUploadErrorMessage(error){
  const message = String(error?.message || error || '').trim();
  const normalized = message.toLowerCase();
  const status = String(error?.statusCode || error?.status || '');
  if(normalized.includes('bucket not found') || (normalized.includes('not found') && normalized.includes('bucket'))){
    return 'مساحة تخزين الصور غير موجودة. نفّذ ملف step-6.sql في Supabase SQL Editor ثم أعد المحاولة.';
  }
  if(normalized.includes('row-level security') || normalized.includes('violates') || normalized.includes('policy') || status === '403'){
    return 'تم رفض رفع الصورة بسبب صلاحيات Storage. تأكد من تنفيذ سياسات step-6.sql وأن الحساب الحالي مشرف.';
  }
  if(status === '401' || normalized.includes('jwt') || normalized.includes('auth')){
    return 'انتهت جلسة الدخول. سجّل الخروج ثم ادخل بحساب المشرف وأعد المحاولة.';
  }
  if(normalized.includes('mime') || normalized.includes('content type')){
    return 'نوع الصورة غير مسموح به في Storage. استخدم JPG أو PNG أو WEBP أو GIF.';
  }
  return message
    ? `تعذر رفع الصورة: ${message}`
    : 'تعذر رفع الصورة. تأكد من إعداد مساحة التخزين ثم أعد المحاولة.';
}

function projectImagePathFromUrl(url){
  if(!url) return '';
  try{
    const parsed = new URL(url, window.location.href);
    const marker = `/storage/v1/object/public/${PROJECT_IMAGE_BUCKET}/`;
    const start = parsed.pathname.indexOf(marker);
    return start === -1 ? '' : decodeURIComponent(parsed.pathname.slice(start + marker.length));
  }catch(error){
    return '';
  }
}

function setProjectImageStatus(message, ok = false){
  const status = document.getElementById('pf-image-status');
  if(!status) return;
  status.textContent = message || '';
  status.classList.toggle('ok', Boolean(ok));
}

function projectImageValidationState(file){
  if(!window.__projectImageValidation) window.__projectImageValidation = new WeakMap();
  return window.__projectImageValidation.get(file) || {status:'pending', message:'جارٍ التحقق…'};
}

function updateProjectImageValidationStatus(){
  const files = window.__projectImageFiles || [];
  const validation = files.map(projectImageValidationState);
  const invalid = validation.filter(item => item.status === 'invalid').length;
  const pending = validation.filter(item => item.status === 'pending').length;
  if(invalid){
    setProjectImageStatus(`يوجد ${invalid} صورة غير صالحة. احذفها من المعاينة قبل الحفظ.`);
  }else if(pending){
    setProjectImageStatus('جارٍ التحقق من الصور…');
  }else if(files.length){
    setProjectImageStatus('الصور جاهزة للرفع عند حفظ المشروع.', true);
  }
}

async function validateProjectImageFile(file){
  const message = await projectImageContentError(file);
  if(!window.__projectImageFiles?.includes(file)) return;
  window.__projectImageValidation.set(file, message
    ? {status:'invalid', message}
    : {status:'valid', message:''});
  renderProjectImagePreview();
}

function handleProjectImageSelection(input){
  const files = Array.from(input?.files || []);
  if(input) input.value = '';
  if(!files.length) return;
  window.__projectImageFiles = window.__projectImageFiles || [];
  if(!window.__projectImageValidation) window.__projectImageValidation = new WeakMap();
  const existingCount = document.getElementById('pf-image-replace')?.checked
    ? 0
    : (window.__projectImageExisting || []).length;
  const remaining = PROJECT_IMAGE_MAX_COUNT - existingCount - window.__projectImageFiles.length;
  if(remaining <= 0){
    setProjectImageStatus(`يمكن إضافة ${PROJECT_IMAGE_MAX_COUNT} صور كحد أقصى للمشروع.`);
    return;
  }
  const acceptedFiles = files.slice(0, remaining);
  acceptedFiles.forEach(file => {
    const basicError = projectImageFileError(file);
    window.__projectImageFiles.push(file);
    window.__projectImageValidation.set(file, basicError
      ? {status:'invalid', message:basicError}
      : {status:'pending', message:'جارٍ التحقق…'});
  });
  if(files.length > acceptedFiles.length){
    setProjectImageStatus(`تمت إضافة ${acceptedFiles.length} صور فقط لأن الحد الأقصى هو ${PROJECT_IMAGE_MAX_COUNT}.`);
  }
  renderProjectImagePreview();
  acceptedFiles
    .filter(file => !projectImageFileError(file))
    .forEach(file => validateProjectImageFile(file));
}

function renderProjectImagePreview(){
  const preview = document.getElementById('pf-image-preview');
  const name = document.getElementById('pf-image-name');
  if(!preview) return;
  const existing = document.getElementById('pf-image-replace')?.checked
    ? []
    : (window.__projectImageExisting || []);
  const files = window.__projectImageFiles || [];
  const images = [
    ...existing.map((src, index) => ({src, revoke:false, kind:'existing', index})),
    ...files.map((file, index) => ({
      src:URL.createObjectURL(file),
      revoke:true,
      kind:'file',
      index,
      file,
      validation:projectImageValidationState(file)
    }))
  ];
  if(window.__projectImagePreviewUrls){
    window.__projectImagePreviewUrls.forEach(url => URL.revokeObjectURL(url));
  }
  window.__projectImagePreviewUrls = images.filter(image => image.revoke).map(image => image.src);
  preview.innerHTML = images.length
    ? `<div class="image-upload-preview-grid">${images.map((image, index) => {
        const validation = image.validation || {status:'valid', message:''};
        const invalid = validation.status === 'invalid';
        const pending = validation.status === 'pending';
        const badge = invalid
          ? `<span class="image-upload-preview-badge">${escapeHtml(validation.message)}</span>`
          : (pending ? `<span class="image-upload-preview-badge pending">جارٍ التحقق</span>` : '');
        const brokenHandler = image.kind === 'file'
          ? ` onerror="markProjectImagePreviewError(${image.index})"`
          : '';
        return `<div class="image-upload-preview-item ${invalid?'invalid ':''}${pending?'pending':''}">
          <img src="${escapeHtml(image.src)}" alt="صورة المشروع ${index + 1}"${brokenHandler}>
          <button type="button" class="image-upload-preview-remove" onclick="removeProjectImage('${image.kind}', ${image.index})" aria-label="حذف الصورة">×</button>
          ${badge}
        </div>`;
      }).join('')}</div>`
    : 'لا توجد صور مضافة حاليًا';
  if(name) name.textContent = files.length ? `${files.length} صور جاهزة للرفع` : (existing.length ? `${existing.length} صور محفوظة` : 'اختيار صور المشروع');
  updateProjectImageValidationStatus();
}

function markProjectImagePreviewError(index){
  const file = window.__projectImageFiles?.[index];
  if(!file) return;
  if(!window.__projectImageValidation) window.__projectImageValidation = new WeakMap();
  const current = projectImageValidationState(file);
  if(current.status === 'valid') return;
  window.__projectImageValidation.set(file, {
    status:'invalid',
    message:'هذه الصورة تالفة أو لا يمكن قراءتها. احذفها واختر صورة أخرى.'
  });
  renderProjectImagePreview();
}

function removeProjectImage(kind, index){
  if(kind === 'file'){
    const files = window.__projectImageFiles || [];
    const [removed] = files.splice(index, 1);
    if(removed && window.__projectImagePreviewUrls){
      // The complete preview URL list is revoked again by renderProjectImagePreview.
      window.__projectImageValidation?.delete(removed);
    }
  }else if(kind === 'existing'){
    const existing = window.__projectImageExisting || [];
    if(index < 0 || index >= existing.length) return;
    existing.splice(index, 1);
    window.__projectImageExistingChanged = true;
  }
  renderProjectImagePreview();
  setProjectImageStatus('تم حذف الصورة من القائمة. اضغط "حفظ المشروع" لتأكيد الحذف.', true);
}

async function derivePinProof(pin){
  const normalized = String(pin || '');
  const key = await crypto.subtle.importKey(
    'raw',
    new TextEncoder().encode(normalized),
    'PBKDF2',
    false,
    ['deriveBits']
  );
  const bits = await crypto.subtle.deriveBits({
    name: 'PBKDF2',
    salt: new TextEncoder().encode(AUTH_KDF_SALT),
    iterations: 120000,
    hash: 'SHA-256'
  }, key, 256);
  return Array.from(new Uint8Array(bits), byte => byte.toString(16).padStart(2, '0')).join('');
}

async function callAuthFunction(action, payload = {}, accessToken = ''){
  if(!AUTH_FUNCTION_URL || !SUPABASE_PUBLISHABLE_KEY) throw new Error('backend_not_configured');
  const headers = {
    'Content-Type': 'application/json',
    'apikey': SUPABASE_PUBLISHABLE_KEY
  };
  if(accessToken) headers.Authorization = `Bearer ${accessToken}`;
  const response = await fetch(AUTH_FUNCTION_URL, {
    method: 'POST',
    headers,
    body: JSON.stringify({action, ...payload})
  });
  const data = await response.json().catch(() => ({}));
  if(!response.ok) throw new Error(data.error || 'request_failed');
  return data;
}

/* ================= LIVE DATA ================= */
let liveDataLoading = false;
let liveDataReady = false;

function liveDate(value){
  if(!value) return '—';
  return new Date(value).toLocaleDateString('ar-SA', {
    day:'numeric',
    month:'long',
    year:'numeric'
  });
}

function asNumber(value){
  const number = Number(value);
  return Number.isFinite(number) ? number : 0;
}

function mapProjectRow(row, donations, imageRows){
  const projectDonations = (donations || [])
    .filter(donation => donation.project_id === row.id)
    .map(donation => ({
      id: donation.id,
      userId: donation.user_id,
      n: donation.donor_name,
      a: asNumber(donation.amount),
      currency: donation.currency || 'ريال سعودي',
      amountSar: donation.amount_sar != null ? asNumber(donation.amount_sar) : asNumber(donation.amount),
      status: donation.status,
      createdAt: donation.created_at
    }))
    .sort((a, b) => {
      const rank = {confirmed:0, review:1, waiting:2};
      return (rank[a.status] ?? 3) - (rank[b.status] ?? 3)
        || String(a.createdAt || '').localeCompare(String(b.createdAt || ''));
    });
  const galleryImages = (imageRows || [])
    .filter(image => image.project_id === row.id)
    .sort((a, b) => (a.sort_order || 0) - (b.sort_order || 0))
    .map(image => image.image_url)
    .filter(Boolean);
  const images = [...new Set([row.cover_image_url, ...galleryImages].filter(Boolean))].slice(0, PROJECT_IMAGE_MAX_COUNT);
  return {
    id: row.id,
    cover: 'a',
    image: images[0] || '',
    images,
    title: row.title,
    shortDesc: row.short_description || '',
    fullDesc: row.full_description || '',
    total: asNumber(row.total_cost),
    collected: asNumber(row.collected_amount),
    suggested: row.suggested_donation == null ? null : asNumber(row.suggested_donation),
    currency: row.currency || 'ريال سعودي',
    donors: projectDonations,
    donorCount: projectDonations.length,
    archiveStatus: row.archive_category || undefined,
    year: row.archived_at ? new Date(row.archived_at).getFullYear().toString() : ''
  };
}

function mapNewsRow(row){
  return {
    id: row.id,
    type: row.type,
    date: liveDate(row.created_at),
    title: row.title,
    body: row.body || '',
    options: (row.poll_options || []).map(option => ({
      id: option.id,
      t: option.option_text,
      v: asNumber(option.vote_count)
    }))
  };
}

async function loadLiveData(){
  if(!supabaseClient || liveDataLoading) return;
  liveDataLoading = true;
  try{
    const requests = [
      supabaseClient
        .from('projects')
        .select('id,title,short_description,full_description,cover_image_url,total_cost,collected_amount,suggested_donation,currency,status,archive_category,archived_at,created_at')
        .order('created_at', {ascending:false}),
      supabaseClient
        .from('news_posts')
        .select('id,type,title,body,created_at,created_by,poll_options(id,option_text,vote_count)')
        .order('created_at', {ascending:false}),
      supabaseClient
        .from('project_images')
        .select('project_id,image_url,sort_order')
        .order('sort_order', {ascending:true}),
      supabaseClient
        .from('donations')
        .select('id,project_id,user_id,donor_name,amount,currency,amount_sar,status,created_at,confirmed_at')
        .order('created_at', {ascending:false}),
      supabaseClient
        .from('settings')
        .select('usd_rate,yer_rate')
        .eq('id', 1)
        .maybeSingle()
    ];

    if(state.currentUserId){
      requests.push(
        supabaseClient.from('poll_votes')
          .select('poll_option_id,poll_options(news_post_id)')
          .eq('user_id', state.currentUserId),
        supabaseClient.from('project_suggestions')
          .select('id,title,description,estimated_cost,submitted_by,status,created_at')
          .order('created_at', {ascending:false})
      );
    } else {
      requests.push(
        Promise.resolve({data:[], error:null}),
        Promise.resolve({data:[], error:null})
      );
    }

    if(state.isAdmin && state.currentSession?.access_token){
      const accountData = await callAuthFunction(
        'list',
        {},
        state.currentSession.access_token
      );
      state.accounts = accountData.accounts || [];
      DATA.members = state.accounts.map(account => ({
        id: account.id,
        name: account.name,
        role: account.role
      }));
    }else if(state.currentUserId){
      DATA.members = [{
        id: state.currentUserId,
        name: state.userName,
        role: state.isAdmin ? 'admin' : 'member'
      }];
    }else{
      DATA.members = [];
    }

    const [projectsResult, newsResult, imageResult, donationsResult, settingsResult, votesResult, suggestionsResult] =
      await Promise.all(requests);
    const firstError = [projectsResult, newsResult, imageResult, donationsResult, votesResult, suggestionsResult]
      .find(result => result?.error);
    if(firstError?.error) throw firstError.error;

    if(settingsResult && !settingsResult.error && settingsResult.data){
      state.rates = {
        usd: asNumber(settingsResult.data.usd_rate) || state.rates.usd,
        yer: asNumber(settingsResult.data.yer_rate) || state.rates.yer
      };
    }

    const donations = donationsResult.data || [];
    const projects = (projectsResult.data || []).map(project => mapProjectRow(project, donations, imageResult.data || []));
    DATA.projects = projects.filter(project => !project.archiveStatus);
    DATA.archive = projects.filter(project => Boolean(project.archiveStatus));
    DATA.news = (newsResult.data || []).map(mapNewsRow);
    state.votedPolls = Object.fromEntries(
      (votesResult.data || [])
        .filter(vote => vote.poll_options?.news_post_id)
        .map(vote => [vote.poll_options.news_post_id, true])
    );
    DATA.suggestions = (suggestionsResult.data || []).map(suggestion => ({
      id: suggestion.id,
      title: suggestion.title,
      desc: suggestion.description || '',
      cost: suggestion.estimated_cost == null ? null : asNumber(suggestion.estimated_cost),
      by: suggestion.submitted_by || '',
      status: suggestion.status,
      createdAt: liveDate(suggestion.created_at)
    }));
    liveDataReady = true;
    render();
  }catch(error){
    console.error('Live data load failed:', error);
    if(liveDataReady) showToast('تعذر تحديث البيانات من قاعدة البيانات');
  }finally{
    liveDataLoading = false;
  }
}

async function reloadLiveData(message){
  await loadLiveData();
  if(message) showToast(message);
}

// توحيد اسم العائلة في البيانات المعروضة داخل البطاقات والقوائم.
function normalizeFamilyName(value){
  if(typeof value === 'string') return value.replace(/[\u0622]\u0644\s+/g, '');
  if(Array.isArray(value)) return value.map(normalizeFamilyName);
  if(value && typeof value === 'object'){
    Object.keys(value).forEach(key => { value[key] = normalizeFamilyName(value[key]); });
  }
  return value;
}

/* ================= HELPERS ================= */
function initials(name){ return name.trim().split(' ')[0][0]; }
function shortName(name){
  const parts = (name || '').trim().split(/\s+/).filter(Boolean);
  return parts.length > 2 ? `${parts[0]} ${parts[parts.length - 1]}` : (name || '');
}
function fmt(n){ return n.toLocaleString('ar-SA'); }
function pct(collected,total){ return Math.min(100, Math.round((collected/total)*100)); }
function statusLabel(s){ return {waiting:'بانتظار الدفع', review:'قيد المراجعة', confirmed:'تم تأكيد الدفع'}[s] || 'بانتظار الدفع'; }
function toSar(amount, currency){
  if(currency === 'دولار') return amount / (state.rates.usd || 0.2667);
  if(currency === 'ريال يمني') return amount / (state.rates.yer || 135);
  return amount; // ريال سعودي
}
function currencyBreakdown(donors){
  const totals = {};
  (donors || []).forEach(d => {
    const c = d.currency || 'ريال سعودي';
    totals[c] = (totals[c] || 0) + asNumber(d.a);
  });
  const order = ['ريال سعودي', 'دولار', 'ريال يمني'];
  return order
    .filter(c => totals[c] > 0)
    .map(c => `${fmt(totals[c])} ${c}`)
    .join(' + ');
}
function archiveStatusLabel(s){ return {completed:'مكتمل', cancelled:'ملغى', postponed:'مؤجل', incomplete:'لم يكتمل'}[s] || 'مكتمل'; }
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(()=> t.classList.remove('show'), 2200);
}

const AUTH_SLOT_DX = [-30, -10, 10, 30];
const AUTH_SLOT_ANGLE = [-16, -6, 6, 16];
const AUTH_SLOT_HOME_ANGLE = [-7, -3, 3, 7];

function animateAuthSpread(){
  const slots = Array.from(document.querySelectorAll('.auth-slot'));
  if(slots.length !== 4) return Promise.resolve();
  slots.forEach((slot, index) => {
    slot.animate([
      { transform:'translate(0px, 0px) rotate(0deg)' },
      { transform:`translate(${AUTH_SLOT_DX[index]}px, 0px) rotate(${AUTH_SLOT_ANGLE[index]}deg)` }
    ], {
      duration:560,
      delay:index * 45,
      easing:'cubic-bezier(.22,.8,.25,1)',
      fill:'forwards'
    });
  });
  return new Promise(resolve => setTimeout(resolve, 560 + 3 * 45 + 120));
}

function animateAuthConverge(){
  const slots = Array.from(document.querySelectorAll('.auth-slot'));
  if(slots.length !== 4) return Promise.resolve();
  slots.forEach((slot, index) => {
    slot.animate([
      { transform:`translate(${AUTH_SLOT_DX[index]}px, 0px) rotate(${AUTH_SLOT_ANGLE[index]}deg)`, opacity:1 },
      { transform:`translate(0px, 0px) rotate(${AUTH_SLOT_HOME_ANGLE[index]}deg)`, opacity:1, offset:.78 },
      { transform:`translate(0px, 0px) rotate(0deg)`, opacity:0 }
    ], {
      duration:460,
      delay:(3 - index) * 40,
      easing:'cubic-bezier(.3,.7,.25,1)',
      fill:'forwards'
    });
  });
  return new Promise(resolve => setTimeout(resolve, 460 + 3 * 40));
}

function resetAuthAnimation(){
  const result = document.getElementById('auth-result');
  if(result) result.classList.remove('show','win','bad');
  document.querySelectorAll('.auth-slot').forEach(slot => {
    slot.getAnimations().forEach(animation => animation.cancel());
    slot.classList.remove('filled','glowing');
    slot.style.opacity = '';
  });
  document.querySelectorAll('[data-auth-i]').forEach(input => {
    input.value = '';
    input.style.pointerEvents = '';
  });
  setAuthStatus('');
}

function bindAuthScreen(){
  const inputs = Array.from(document.querySelectorAll('[data-auth-i]'));
  inputs.forEach((input, i) => {
    input.addEventListener('input', event => {
      if(authAnimationLocked) return;
      const value = event.target.value.replace(/[^0-9]/g,'').slice(0,1);
      event.target.value = value;
      input.closest('.auth-slot').classList.toggle('filled', Boolean(value));
      setAuthStatus('');
      if(value){
        const slot = input.closest('.auth-slot');
        slot.classList.remove('glowing');
        void slot.offsetWidth;
        slot.classList.add('glowing');
        if(inputs[i+1]) inputs[i+1].focus();
      }
      if(inputs.every(item => item.value)) submitAuthScreen();
    });
    input.addEventListener('keydown', event => {
      if(authAnimationLocked) return;
      if(event.key === 'Backspace' && !input.value && inputs[i-1]) inputs[i-1].focus();
      if(event.key === 'Enter') submitAuthScreen();
    });
    input.addEventListener('paste', event => {
      if(authAnimationLocked) return;
      event.preventDefault();
      const value = (event.clipboardData || window.clipboardData).getData('text').replace(/[^0-9]/g,'').slice(0,4);
      value.split('').forEach((digit, index) => {
        if(!inputs[index]) return;
        inputs[index].value = digit;
        inputs[index].closest('.auth-slot').classList.add('filled');
      });
      if(inputs[Math.min(value.length, 3)]) inputs[Math.min(value.length, 3)].focus();
      if(value.length === 4) submitAuthScreen();
    });
  });
  const name = document.getElementById('auth-name');
  if(name) name.focus();
}
function setAuthStatus(message, ok){
  const status = document.getElementById('auth-status');
  if(!status) return;
  status.textContent = message || '';
  status.classList.toggle('show', Boolean(message));
  status.classList.toggle('ok', Boolean(ok));
}
function authErrorMessage(error){
  const code = error instanceof Error ? error.message : String(error || '');
  return ({
    invalid_credentials:'الاسم أو رمز PIN غير صحيح.',
    account_inactive:'هذا الحساب غير مفعّل حاليًا.',
    too_many_attempts:'محاولات كثيرة. انتظر 15 دقيقة ثم حاول مرة أخرى.',
    name_already_exists:'يوجد حساب بهذا الاسم بالفعل.',
    admin_required:'هذه العملية متاحة للمشرفين فقط.',
    authentication_required:'انتهت جلسة الدخول. سجّل الدخول مرة أخرى.',
    backend_not_configured:'لم يتم إعداد اتصال المصادقة بعد.',
    request_failed:'تعذر إكمال العملية. حاول مرة أخرى.'
  }[code] || 'تعذر إكمال المصادقة. حاول مرة أخرى.');
}

async function applyAuthSession(session, account){
  state.currentSession = session || null;
  if(!session || !session.user){
    state.currentUserId = null;
    state.userName = null;
    state.isAdmin = false;
    return;
  }
  let profile = account;
  if(!profile && supabaseClient){
    const result = await supabaseClient
      .from('users')
      .select('id,name,role,is_active')
      .eq('id', session.user.id)
      .maybeSingle();
    profile = result.data;
  }
  if(!profile || !profile.is_active){
    if(supabaseClient) await supabaseClient.auth.signOut();
    state.currentUserId = null;
    state.userName = null;
    state.isAdmin = false;
    return;
  }
  state.currentUserId = profile.id;
  state.userName = profile.name;
  state.isAdmin = profile.role === 'admin';
}

async function submitAuthScreen(){
  if(authAnimationLocked) return;
  const name = document.getElementById('auth-name');
  const inputs = Array.from(document.querySelectorAll('[data-auth-i]'));
  const pin = inputs.map(input => input.value).join('');
  if(!name || !name.value.trim()){
    setAuthStatus('اكتب الاسم أولًا للمتابعة');
    name && name.focus();
    return;
  }
  if(!/^\d{4}$/.test(pin)){
    setAuthStatus('أدخل أرقام PIN الأربعة');
    return;
  }
  if(!window.crypto?.subtle){
    setAuthStatus('المتصفح لا يدعم المصادقة الآمنة');
    return;
  }

  authAnimationLocked = true;
  const result = document.getElementById('auth-result');
  inputs.forEach(input => { input.style.pointerEvents = 'none'; });
  result.classList.remove('show','win','bad');
  setAuthStatus('جارٍ التحقق بشكل آمن…');
  const spreadPromise = animateAuthSpread();
  try{
    const pinProof = await derivePinProof(pin);
    const action = AUTH_SCREEN_MODE === 'register' ? 'register' : 'login';
    const data = await callAuthFunction(action, {
      name: name.value.trim(),
      pinProof
    });
    if(supabaseClient && data.session){
      const sessionResult = await supabaseClient.auth.setSession({
        access_token: data.session.access_token,
        refresh_token: data.session.refresh_token
      });
      if(sessionResult.error) throw sessionResult.error;
    }
    await applyAuthSession(data.session, data.account);
    await loadLiveData();
    await spreadPromise;
    await animateAuthConverge();
    result.classList.add('show','win');
    setAuthStatus(
      AUTH_SCREEN_MODE === 'register' ? 'تم إنشاء حسابك بنجاح.' : 'تم تسجيل الدخول بنجاح.',
      true
    );
    setTimeout(() => {
      closeModal();
      render();
      showToast(AUTH_SCREEN_MODE === 'register' ? 'مرحبًا بك — تم إنشاء الحساب' : 'تم تسجيل الدخول بنجاح');
    }, 650);
  }catch(error){
    await spreadPromise;
    await animateAuthConverge();
    result.classList.add('show','bad');
    setAuthStatus(authErrorMessage(error));
    setTimeout(() => {
      if(document.getElementById('auth-result') === result){
        resetAuthAnimation();
        authAnimationLocked = false;
      }
    }, 3200);
  }
}

async function saveAdminAccount(){
  const id = document.getElementById('af-id').value;
  const name = document.getElementById('af-name').value.trim();
  const pin = document.getElementById('af-pin').value.trim();
  const role = document.getElementById('af-role').value;
  if(!name){ showToast('الرجاء إدخال الاسم'); return; }
  if(!id && !/^\d{4}$/.test(pin)){ showToast('أدخل PIN مكوّنًا من 4 أرقام'); return; }
  if(id && pin && !/^\d{4}$/.test(pin)){ showToast('PIN يجب أن يتكوّن من 4 أرقام'); return; }
  const payload = {id, name, role};
  if(id) payload.isActive = document.getElementById('af-active').checked;
  if(pin) payload.pinProof = await derivePinProof(pin);
  try{
    await callAuthFunction(id ? 'update' : 'create', payload, state.currentSession?.access_token || '');
    showToast(id ? 'تم تحديث الحساب' : 'تم إنشاء الحساب');
    await openAccountModal();
  }catch(error){
    showToast(authErrorMessage(error));
  }
}

async function deleteAdminAccount(id){
  const account = window.__DIWAN_ACCOUNTS?.[id];
  if(!account || !confirm(`هل تريد حذف حساب «${account.name}» نهائيًا؟`)) return;
  try{
    await callAuthFunction('delete', {id}, state.currentSession?.access_token || '');
    showToast('تم حذف الحساب');
    await openAccountModal();
  }catch(error){
    showToast(authErrorMessage(error));
  }
}

function cycleProjectImage(projectId, step){
  const card = document.getElementById(`card-${projectId}`);
  if(!card) return;
  const images = Array.from(card.querySelectorAll('.project-gallery-image'));
  if(images.length < 2) return;
  const activeIndex = images.findIndex(image => image.classList.contains('active'));
  const nextIndex = (activeIndex + step + images.length) % images.length;
  images.forEach((image, index) => image.classList.toggle('active', index === nextIndex));
}
function shareWhatsapp(projectId){
  const project = [...(DATA.projects || []), ...(DATA.archive || [])].find(item => item.id === projectId);
  if(!project) return;
  const rank = {confirmed:0, review:1, waiting:2};
  const donors = [...(project.donors || [])].sort((a, b) =>
    (rank[a.status] ?? 3) - (rank[b.status] ?? 3)
  );
  const donorLines = donors.length
    ? donors.map((donor, index) => {
        const dCurrency = donor.currency || 'ريال سعودي';
        const amtPart = dCurrency === 'ريال سعودي'
          ? `${fmt(donor.a)} ر.س`
          : `${fmt(donor.a)} ${dCurrency} (يعادل ${fmt(Math.round(donor.amountSar))} ر.س)`;
        return `${index + 1}. ${donor.n} — ${amtPart} — ${statusLabel(donor.status)}`;
      }).join('\n')
    : 'لا توجد تبرعات مسجلة حتى الآن.';
  const breakdown = currencyBreakdown(project.donors);
  const totalDonation = asNumber(project.collected);
  const remaining = Math.max(0, asNumber(project.total) - totalDonation);
  const message = [
    `📌 ${project.title}`,
    '',
    project.shortDesc || '',
    '',
    'تفاصيل المشروع:',
    project.fullDesc || project.shortDesc || '—',
    '',
    'المتبرعون:',
    donorLines,
    '',
    'الملخص المالي:',
    `• إجمالي التكلفة: ${fmt(asNumber(project.total))} ر.س`,
    `• إجمالي التبرع: ${fmt(totalDonation)} ر.س`,
    `• المتبقي: ${fmt(remaining)} ر.س`,
    ...(breakdown ? [`• حسب العملة: ${breakdown}`] : [])
  ].join('\n');
  const whatsappUrl = `https://wa.me/?text=${encodeURIComponent(message)}`;
  const popup = window.open(whatsappUrl, '_blank', 'noopener,noreferrer');
  if(!popup) window.location.href = whatsappUrl;
}

async function confirmPledge(){

  const amt = Number(document.getElementById('pd-amount').value);
  const currency = document.getElementById('pd-currency').value || 'ريال سعودي';
  if(!amt || amt<=0){ showToast('الرجاء إدخال مبلغ صحيح'); return; }
  if(!supabaseClient || !state.currentUserId){ showToast('تعذر الاتصال بقاعدة البيانات'); return; }
  const amountSar = toSar(amt, currency);
  const project = DATA.projects.find(x=>x.id===id) || DATA.archive.find(x=>x.id===id);
  if(!project){ showToast('تعذر العثور على المشروع'); return; }

    project_id: id,
    user_id: state.currentUserId,
    donor_name: state.userName || 'عضو الديوان',
    amount: amt,
    currency: currency,
    amount_sar: amountSar,
    status: 'waiting',

    console.error('Donation insert failed:', insertError);
    showToast('تعذر تسجيل التبرع. حاول مرة أخرى.');
    return;
  }

  const newCollected = Math.min(project.total, asNumber(project.collected) + amountSar);
  const { error: updateError } = await supabaseClient
    .from('projects')
    .update({ collected_amount: newCollected })
    .eq('id', id);
  if(updateError){
    console.error('Project collected update failed:', updateError);
  }

  closeModal();
  const equivNote = currency !== 'ريال سعودي' ? ` (يعادل ${fmt(Math.round(amountSar))} ر.س)` : '';
  await reloadLiveData(`تم تسجيل تبرعك بمبلغ ${fmt(amt)} ${currency}${equivNote} — الحالة: بانتظار الدفع`);
}

async function saveProject(){
  const id = document.getElementById('pf-id').value;
  const existingProject = id ? DATA.projects.find(x=>x.id===id) : null;
  const imageFiles = window.__projectImageFiles || [];
  const replaceImages = Boolean(document.getElementById('pf-image-replace')?.checked);
  const existingImages = window.__projectImageExisting || [];
  const imageValidation = imageFiles.map(projectImageValidationState);
  const invalidImages = imageValidation.filter(item => item.status === 'invalid');
  const pendingImages = imageValidation.filter(item => item.status === 'pending');
  if(invalidImages.length){
    setProjectImageStatus('احذف الصور غير الصالحة من المعاينة قبل حفظ المشروع.');
    showToast('يوجد ملف صورة تالف. احذفه من المعاينة ثم أعد الحفظ.');
    return;
  }
  if(pendingImages.length){
    setProjectImageStatus('انتظر اكتمال التحقق من الصور ثم أعد الحفظ.');
    showToast('جارٍ التحقق من الصور، انتظر لحظة ثم أعد الحفظ.');
    return;
  }
  const finalImageCount = (replaceImages ? 0 : existingImages.length) + imageFiles.length;
  if(finalImageCount > PROJECT_IMAGE_MAX_COUNT){
    showToast(`يمكن حفظ ${PROJECT_IMAGE_MAX_COUNT} صور كحد أقصى للمشروع`);
    return;
  }
  const title = document.getElementById('pf-title').value.trim();
  if(!title){ showToast('الرجاء إدخال عنوان المشروع'); return; }
  const payload = {
    title,
    short_description: document.getElementById('pf-short').value.trim(),
    full_description: document.getElementById('pf-full').value.trim(),
    total_cost: Number(document.getElementById('pf-total').value)||1,
    collected_amount: Number(document.getElementById('pf-collected').value)||0,
    suggested_donation: Number(document.getElementById('pf-suggested').value)||null,
    currency: 'ريال سعودي'
  };
  if(payload.collected_amount > payload.total_cost){
    showToast('المبلغ المُجمّع لا يمكن أن يتجاوز التكلفة الكلية');
    return;
  }
  if(!supabaseClient || !state.isAdmin){
    showToast('تعذر الاتصال بقاعدة البيانات');
    return;
  }
  if(imageFiles.length){
    setProjectImageStatus('جارٍ رفع الصور بأمان…');
    showToast('جارٍ رفع صور المشروع…');
  }

  const projectId = id || projectImageToken();
  const oldImages = window.__projectImageOriginal || existingImages;
  const imagesChanged = imageFiles.length || replaceImages || window.__projectImageExistingChanged;
  let uploadedImages = [];
  try{
    if(imageFiles.length){
      uploadedImages = await Promise.all(imageFiles.map(file => uploadProjectCover(file, projectId)));
    }
    const finalImages = [...(replaceImages ? [] : oldImages), ...uploadedImages.map(image => image.url)]
      .slice(0, PROJECT_IMAGE_MAX_COUNT);
    payload.cover_image_url = finalImages[0] || null;

    if(id){
      const { error } = await supabaseClient.from('projects').update(payload).eq('id', id);
      if(error) throw error;
    }else{
      const { error } = await supabaseClient.from('projects').insert({
        id: projectId,
        ...payload,
        status: 'active',
        archive_category: null,
        archived_at: null
      });
      if(error) throw error;
    }

    if(id && imagesChanged){
      const { error: imageDeleteError } = await supabaseClient
        .from('project_images')
        .delete()
        .eq('project_id', id);
      if(imageDeleteError) throw imageDeleteError;
    }
    if(finalImages.length){
      const { error: imageInsertError } = await supabaseClient
        .from('project_images')
        .insert(finalImages.map((imageUrl, sortOrder) => ({
          project_id: projectId,
          image_url: imageUrl,
          sort_order: sortOrder
        })));
      if(imageInsertError) throw imageInsertError;
    }
    if(imagesChanged){
      const retained = new Set(finalImages);
      await Promise.all(oldImages
        .filter(imageUrl => !retained.has(imageUrl))
        .map(imageUrl => deleteProjectCover(projectImagePathFromUrl(imageUrl))));
    }
    closeModal();
    await reloadLiveData(id ? 'تم تحديث المشروع وصور الغلاف' : 'تم إضافة المشروع بنجاح');
  }catch(error){
    await Promise.all(uploadedImages.map(image => deleteProjectCover(image.path)));
    console.error('Project save or image upload failed:', error);
    const message = imageFiles.length
      ? projectImageUploadErrorMessage(error)
      : (id ? 'تعذر تحديث المشروع' : 'تعذر إضافة المشروع');
    setProjectImageStatus(message);
    showToast(message);
  }
}

function toggleIdentityItem(index){
  const accordion = document.querySelector('[data-identity-accordion]');
  if(!accordion) return;
  const cards = Array.from(accordion.querySelectorAll('[data-identity-card]'));
  const nextOpen = state.identityOpen === index ? -1 : index;
  state.identityOpen = nextOpen;
  cards.forEach((card, cardIndex) => {
    const isOpen = cardIndex === nextOpen;
    card.classList.toggle('is-open', isOpen);
    const trigger = card.querySelector('.identity-trigger');
    if(trigger) trigger.setAttribute('aria-expanded', String(isOpen));
  });
}

function renderNews(){
  const items = DATA.news.map(n=>{
    const alreadyVoted = state.votedPolls[n.id];
    if(n.type==='poll'){
      const total = n.options.reduce((s,o)=>s+o.v,0) || 1;
      const optionsHtml = n.options.map((o,i)=>{
        const p = Math.round((o.v/total)*100);
        return alreadyVoted
          ? `<div class="poll-option"><div class="fill" style="width:${p}%"></div><span class="lbl"><span>${o.t}</span><span>${p}%</span></span></div>`
          : `<button class="poll-option" onclick="votePoll('${n.id}', ${i})"><span class="lbl"><span>${o.t}</span></span></button>`;
      }).join('');
      return `
        <div class="news-card">
          ${state.isAdmin ? `<button class="admin-icon-btn news-admin-icon" style="background:var(--teal-tint); color:var(--teal)" onclick="deleteNews('${n.id}')">${ICON_TRASH}</button>` : ''}
          <div class="news-date">${n.date}</div>
          <span class="poll-badge">📊 استطلاع رأي</span>
          <div class="news-title">${n.title}</div>
          <p class="news-body" style="margin-bottom:12px">${n.body}</p>
          ${optionsHtml}
          ${alreadyVoted ? `<div class="poll-voted-note">شكرًا لمشاركتك — تم تسجيل صوتك.</div>` : `<div class="poll-voted-note">سجّل الدخول للتصويت في الاستطلاع.</div>`}
        </div>`;
    }
    return `
      <div class="news-card">
        ${state.isAdmin ? `<button class="admin-icon-btn news-admin-icon" style="background:var(--teal-tint); color:var(--teal)" onclick="deleteNews('${n.id}')">${ICON_TRASH}</button>` : ''}
        <div class="news-date">${n.date}</div>
        <div class="news-title">${n.title}</div>
        <p class="news-body">${n.body}</p>
      </div>`;
  }).join('');
  return `
    <div class="page-header">
      <h1>الأخبار والإعلانات</h1>
      <p>آخر مستجدات مشاريع القرية، إلى جانب استطلاعات الرأي الدورية.</p>
    </div>
    <section><div class="news-stack">${items}</div></section>
  `;
}
async function votePoll(id, idx){
  if(!requireLogin()) return;
  if(state.votedPolls[id]) return;
  const n = DATA.news.find(x=>x.id===id);
  const option = n?.options?.[idx];
  if(!option || !supabaseClient) return;
  const { error } = await supabaseClient.from('poll_votes').insert({
    poll_option_id: option.id,
    user_id: state.currentUserId
  });
  if(error){
    if(String(error.message || '').includes('only once')){
      state.votedPolls[id] = true;
      render();
      showToast('سبق أن شاركت في هذا الاستطلاع');
    }else{
      console.error('Poll vote failed:', error);
      showToast('تعذر تسجيل الصوت');
    }
    return;
  }
  await reloadLiveData('تم تسجيل صوتك، شكرًا لمشاركتك');
}
async function deleteNews(id){
  if(!confirm('حذف هذا الخبر؟')) return;
  if(!supabaseClient || !state.isAdmin) return;
  const { error } = await supabaseClient.from('news_posts').delete().eq('id', id);
  if(error){
    console.error('News delete failed:', error);
    showToast('تعذر حذف الخبر');
    return;
  }
  await reloadLiveData('تم حذف الخبر');
}
function openNewsFormModal(){
  openModal(`
    <h3 class="modal-title">نشر خبر جديد</h3>
    <p class="modal-sub">شارك تحديثًا أو أنشئ استطلاع رأي جديد لأهالي القرية.</p>

    <div class="field"><label>النص</label><textarea id="nf-body" placeholder="تفاصيل الخبر..."></textarea></div>
    <div class="checkbox-row"><input type="checkbox" id="nf-ispoll" onchange="document.getElementById('nf-poll-fields').style.display=this.checked?'block':'none'"><label for="nf-ispoll">تحويله إلى استطلاع رأي</label></div>
    <div id="nf-poll-fields" style="display:none">
      <div class="field"><label>الخيار الأول</label><input id="nf-o1" type="text"></div>
      <div class="field"><label>الخيار الثاني</label><input id="nf-o2" type="text"></div>
      <div class="field"><label>الخيار الثالث (اختياري)</label><input id="nf-o3" type="text"></div>
    </div>
    <div class="demo-row">
      <button class="btn-secondary" onclick="closeModal()">إلغاء</button>
      <button class="btn-primary" onclick="saveNews()">نشر</button>
    </div>
  `);
}
async function saveNews(){
  const title = document.getElementById('nf-title').value.trim();
  const body = document.getElementById('nf-body').value.trim();
  if(!title || !body){ showToast('الرجاء تعبئة العنوان والنص'); return; }
  const isPoll = document.getElementById('nf-ispoll').checked;
  if(!supabaseClient || !state.isAdmin || !state.currentUserId) return;
  const options = [document.getElementById('nf-o1').value, document.getElementById('nf-o2').value, document.getElementById('nf-o3').value]
    .map(option => option.trim())
    .filter(Boolean);
  if(isPoll && options.length < 2){
    showToast('أدخل خيارين على الأقل للاستطلاع');
    return;
  }
  const { data: post, error: postError } = await supabaseClient.from('news_posts').insert({
    type: isPoll ? 'poll' : 'post',
    title,
    body,
    created_by: state.currentUserId
  }).select('id').single();
  if(postError || !post){
    console.error('News insert failed:', postError);
    showToast('تعذر نشر الخبر');
    return;
  }
  if(isPoll){
    const { error: optionsError } = await supabaseClient.from('poll_options').insert(
      options.map(option_text => ({news_post_id: post.id, option_text, vote_count: 0}))
    );
    if(optionsError){
      console.error('Poll options insert failed:', optionsError);
      await supabaseClient.from('news_posts').delete().eq('id', post.id);
      showToast('تعذر نشر خيارات الاستطلاع');
      return;
    }
  }
  closeModal();
  await reloadLiveData(isPoll ? 'تم نشر الاستطلاع' : 'تم نشر الخبر');
}

function render(){
  renderAuthArea();

  root.innerHTML = pages[state.page]();
