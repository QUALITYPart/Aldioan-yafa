  requestAnimationFrame(updateStackScroll);
}

function setupMotivationAnimation(){
  const section = document.querySelector('.motivation-section');
  if(!section) return;
  if(!('IntersectionObserver' in window)){
    section.classList.add('is-visible');
    return;
  }
  const observer = new IntersectionObserver(entries => {
    if(entries.some(entry => entry.isIntersecting)){
      section.classList.add('is-visible');
      observer.disconnect();
    }
  }, {threshold:0.28});
  observer.observe(section);
}

function setupJourneySection(){
  const section = document.getElementById('journey-section');
  if(!section) return;
  const sticky = section.querySelector('.journey-sticky');
  if(!sticky) return;
  const vp = window.innerHeight;
  const stickyH = Math.max(470, Math.min(700, vp - 110));
  sticky.style.height = stickyH + 'px';
  // Four images share a shorter scroll runway so each transition feels quick.
  section.style.height = (stickyH + Math.max(520, Math.round(vp * 0.9))) + 'px';
  updateJourneyScroll();
}

function updateJourneyScroll(){
  const section = document.getElementById('journey-section');
  if(!section) return;
  const sticky = section.querySelector('.journey-sticky');
  const images = Array.from(section.querySelectorAll('.journey-image'));
  const copies = Array.from(section.querySelectorAll('.journey-copy'));
  const progressBar = section.querySelector('.journey-progress span');
  if(!sticky || images.length < 2 || copies.length !== images.length || !progressBar) return;
  const total = Math.max(1, section.offsetHeight - sticky.offsetHeight);
  const rect = section.getBoundingClientRect();
  let progress = (70 - rect.top) / total;
  progress = Math.max(0, Math.min(1, progress));
  const continuous = progress * (images.length - 1);
  images.forEach((image, index) => {
    const opacity = Math.max(0, 1 - Math.abs(continuous - index));
    image.style.opacity = String(opacity);
    image.style.transform = `scale(${1.12 - opacity * 0.1})`;
  });
  copies.forEach((copy, index) => {
    const opacity = Math.max(0, 1 - Math.abs(continuous - index));
    copy.style.opacity = String(opacity);
    copy.style.transform = `translateY(${18 - opacity * 18}px)`;
  });
  progressBar.style.transform = `scaleX(${progress})`;
}

/* ---------- sticky stacking cards (scroll-driven, reversible) ---------- */
const STACK_STICKY_TOP = 70;    // must match .stack-sticky { top: 70px } in CSS
const STACK_CARD_PEEK = 30;     // visible top edge between the stacked images
let stackTicking = false;
let stackResizeTimer = null;

function setupStackSizing(){
  const section = document.getElementById('stack-section');
  if(!section) return;
  const sticky = section.querySelector('.stack-sticky');
  const stage = section.querySelector('.stack-stage');
  const cardCount = section.querySelectorAll('.stack-card').length;
  if(!sticky || !stage || !cardCount) return;
  // Use a fixed pixel snapshot of the viewport instead of vh units.
  // Mobile browsers resize the visual viewport (address bar show/hide) mid-scroll,
  // which makes vh-based heights drift and breaks the pin math. Fixed px avoids that.
  const vp = window.innerHeight;
  const stageH = Math.max(340, Math.min(520, Math.round(vp * 0.62)));
  // Give every card its own scroll segment. The sticky card remains pinned
  // while the next photo gets enough distance to travel fully from below.
  // Shorter segments make each image complete its move sooner while scrolling.
  const perSegment = Math.max(340, Math.round(vp * 0.68));
  const segments = Math.max(1, cardCount - 1);
  stage.style.height = stageH + 'px';
  sticky.style.height = 'auto';
  section.style.height = (sticky.offsetHeight + segments * perSegment) + 'px';
}

function updateStackScroll(){
  stackTicking = false;
  const section = document.getElementById('stack-section');
  if(!section) return;
  const sticky = section.querySelector('.stack-sticky');
  const stage = section.querySelector('.stack-stage');
  const cards = Array.from(section.querySelectorAll('.stack-card'));
  if(!sticky || !stage || !cards.length) return;
  const stickyH = sticky.offsetHeight;
  const stageH = stage.offsetHeight;
  const total = section.offsetHeight - stickyH;
  const rect = section.getBoundingClientRect();
  let progress = total > 0 ? (STACK_STICKY_TOP - rect.top) / total : 0;
  progress = Math.max(0, Math.min(1, progress));
  const segments = cards.length - 1;
  const continuous = progress * segments;
  cards.forEach((card, i) => {
    if(i === 0){
      card.style.transform = 'translateY(0)';
      card.style.zIndex = 10;
      return;
    }
    // Each card has one dedicated segment [i-1, i]. It starts completely
    // below the clipped stage and settles a little lower than the card before
    // it, leaving a visible layered edge instead of covering every card fully.
    const local = Math.max(0, Math.min(1, continuous - (i - 1)));
    const hiddenY = stageH;
    const targetY = i * STACK_CARD_PEEK;
    const y = targetY + (hiddenY - targetY) * (1 - local);
    card.style.transform = `translateY(${y}px)`;
    card.style.zIndex = 10 + i;
  });
  updateJourneyScroll();
}
function onStackScroll(){
  if(!stackTicking){ stackTicking = true; requestAnimationFrame(updateStackScroll); }
}
function onStackResize(){
  clearTimeout(stackResizeTimer);
  stackResizeTimer = setTimeout(() => { setupStackSizing(); setupJourneySection(); updateStackScroll(); }, 150);
}
async function restoreAuthSession(){
  if(!supabaseClient) return;
  const { data } = await supabaseClient.auth.getSession();
  await applyAuthSession(data.session);
  await loadLiveData();
  renderAuthArea();
  render();
}

  });
}
